<div class="bar">
  <div class="top">
    <p>{{ goal }}</p>
    <div id="right">
      <button id="edit-button">Edit</button>
      <button id="delete-button" (click)="deleteSelf()">Delete</button>
    </div>
  </div>
  <div class="bottom">
    <h2>{{ habit }}</h2>
    <div id="right">
      <input type="checkbox" (click)="addToStreak()" #streakCheck />
      <img src="" alt="icon" />
      <h2>{{ streak }} days</h2>
    </div>
  </div>
</div>
